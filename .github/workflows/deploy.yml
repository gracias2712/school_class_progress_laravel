name: Deploy Laravel Blade to DomaiNesia

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & FTP Deploy

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, fileinfo, gd, zip, curl
          coverage: none

      - name: 📦 Install Composer Dependencies
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-progress --no-interaction

      - name: 🟢 Setup Node.js & Compile Vite Assets
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          npm ci || npm install
          npm run build

      - name: 🚀 Sync Files via FTP to DomaiNesia
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftp
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            tests/**
            .env
            .env.example
            *.md
            phpunit.xml

      - name: ⚡ Trigger Database Migration di Hosting
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          if [ -z "$DEPLOY_SECRET" ]; then
            echo "DEPLOY_SECRET is not configured in GitHub repository secrets."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            "https://gracias-scp.web.id/api/deploy-migrate-${DEPLOY_SECRET}?seed=1"
